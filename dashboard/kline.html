<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>人生K线 · 乾坤</title><link rel="stylesheet" href="assets/style.css"></head>
<body><header></header>
<main>
  <h1>人生K线</h1><p class="sub">逐年运势评分 · 每根蜡烛 = 一年(流月高低为影线,前年收盘接开盘)· 岁运经典组合事件标注</p>
  <div id="form"></div>
  <div class="row" style="max-width:420px">
    <div><label>起始年龄</label><input id="sa" type="number" value="18"></div>
    <div><label>结束年龄</label><input id="ea" type="number" value="70"></div>
  </div>
  <button class="go" onclick="run()">生成人生K线</button>
  <div id="out"></div>
</main>
<footer>分数为传统规则的量化表达,仅供文化研究与娱乐,现实决策请结合理性判断</footer>
<script src="assets/mingyu.js"></script><script src="assets/common.js"></script>
<script>
document.querySelector('header').innerHTML = headerHTML('kline');
$('#form').innerHTML = birthFormHTML('a');
function run() {
  const p = personFromForm('a');
  let k;
  try { k = MY.calculateLifeKline({ ...p, strengthModel: 'classic-calibrated' }, { startAge: +$('#sa').value, endAge: +$('#ea').value }); }
  catch (e) { $('#out').innerHTML = `<div class="card bad">${e.message}</div>`; return; }
  const ys = k.years;
  const W = Math.max(900, ys.length * 22 + 90), H = 420, padL = 46, padB = 44, padT = 16;
  const xw = (W - padL - 20) / ys.length;
  const yOf = v => padT + (98 - v) / 96 * (H - padT - padB);
  let bars = '';
  ys.forEach((y, i) => {
    const x = padL + i * xw + xw / 2;
    const up = y.close >= y.open;
    const col = up ? '#d1553f' : '#4ea08f';
    const bodyTop = yOf(Math.max(y.open, y.close)), bodyH = Math.max(2, Math.abs(yOf(y.open) - yOf(y.close)));
    bars += `<line x1="${x}" y1="${yOf(y.high)}" x2="${x}" y2="${yOf(y.low)}" stroke="${col}" stroke-width="1.4"/>`;
    bars += `<rect x="${x - xw * 0.32}" y="${bodyTop}" width="${xw * 0.64}" height="${bodyH}" fill="${up ? col : 'none'}" stroke="${col}" stroke-width="1.4"><title>${y.year} ${y.liunianGanZhi} ${y.age}岁 分${y.score} 开${y.open} 高${y.high} 低${y.low} 收${y.close}${y.events.length ? ' | ' + y.events.map(e => e.name).join('、') : ''}</title></rect>`;
    if (y.events.some(e => e.severity === 'major')) bars += `<text x="${x}" y="${yOf(y.low) + 14}" text-anchor="middle" font-size="11" fill="#d1553f">⚡</text>`;
    if (i % 5 === 0) bars += `<text x="${x}" y="${H - padB + 16}" text-anchor="middle" font-size="10.5" fill="${cssVar('--muted')}">${y.year}</text><text x="${x}" y="${H - padB + 30}" text-anchor="middle" font-size="10" fill="${cssVar('--faint')}">${y.age}岁</text>`;
  });
  let grid = '';
  for (const v of [20, 35, 50, 65, 80]) grid += `<line x1="${padL}" y1="${yOf(v)}" x2="${W - 20}" y2="${yOf(v)}" stroke="${cssVar('--line')}" stroke-dasharray="3 4"/><text x="${padL - 8}" y="${yOf(v) + 4}" text-anchor="end" font-size="10.5" fill="${cssVar('--muted')}">${v}</text>`;
  const dayunMarks = ys.map((y, i) => ({ y, i })).filter(({ y, i }) => i === 0 || y.dayunGanZhi !== ys[i - 1].dayunGanZhi)
    .map(({ y, i }) => { const x = padL + i * xw + 2; return `<text x="${x}" y="${padT + 12}" font-size="10.5" fill="${cssVar('--gold')}">${y.dayunGanZhi || ''}</text>`; }).join('');
  const evRows = ys.filter(y => y.events.length).map(y =>
    `<tr><td>${y.year} ${y.liunianGanZhi}(${y.age}岁)</td><td>${y.events.map(e => `<span class="${e.severity === 'major' ? 'bad' : ''}">${e.name}</span>`).join('、')}</td><td>${y.score}</td></tr>`).join('');
  const best = [...ys].sort((a, b) => b.score - a.score).slice(0, 3);
  const worst = [...ys].sort((a, b) => a.score - b.score).slice(0, 3);
  $('#out').innerHTML = `
  <div class="card"><div class="muted">命盘 ${k.natal.pillars} · 日主${k.natal.dayMaster} · 喜 ${k.natal.favorableWuxing.join('')} 忌 ${k.natal.unfavorableWuxing.join('')}(悬停蜡烛看详情;金字为大运换运点)</div>
    <div style="overflow-x:auto"><svg width="${W}" height="${H}" style="min-width:${W}px">${grid}${dayunMarks}${bars}</svg></div>
    <div>🔺 高点:${best.map(y => `<span class="pill fav">${y.year} ${y.liunianGanZhi} ${y.score}</span>`).join('')}
     🔻 低谷:${worst.map(y => `<span class="pill bad">${y.year} ${y.liunianGanZhi} ${y.score}</span>`).join('')}</div></div>
  ${evRows ? `<div class="card"><b>岁运事件年</b><table><tr><th>流年</th><th>经典组合</th><th>分</th></tr>${evRows}</table></div>` : ''}`;
}
</script>
</body></html>
