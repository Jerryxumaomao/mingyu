name: CI

on:
  push:
    branches: [main, p0-paipan-fixes, p1-improvements]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mingyu-core build
      - run: npx tsc --noEmit
      - run: npx tsc --project mcp/tsconfig.json --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mingyu-core build
      - run: pnpm test
      - run: pnpm run test:e2e
      - run: pnpm run prompt:audit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mingyu-core build
      - run: pnpm run build

  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mingyu-core build
      - name: Differential test vs taibu-core (lunar-javascript oracle)
        run: node scripts/differential-test.mjs
        env:
          DIFF_SAMPLES: '3000'
      - name: Property-based paipan invariants
        run: npx tsx --tsconfig tsconfig.app.json --test "tests/paipan-properties.test.ts"
