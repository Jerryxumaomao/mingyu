<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"ZMX";src:url("ZhiMangXing-Regular.ttf")}
*{margin:0;padding:0}
body{width:750px;height:1624px;position:relative;overflow:hidden;
  background:linear-gradient(155deg,#e8ebd2 0%,#dfe3c2 36%,#d0d6aa 68%,#c5cc98 100%)}
/* ── 失焦树影(仿参考图:大团模糊叶影 + 斜穿枝条)── */
.cl{position:absolute;filter:blur(26px);opacity:.42}
.leaf{position:absolute;background:#757d4c;border-radius:52% 48% 55% 45%/58% 55% 45% 42%}
.cl2{position:absolute;filter:blur(34px);opacity:.30}
.branch{position:absolute;width:1500px;height:1500px;border:14px solid transparent;
  border-top-color:#6d7546;border-radius:50%;filter:blur(12px);opacity:.5}
.vig{position:absolute;inset:0;background:
  radial-gradient(120% 70% at 85% 12%,rgba(109,117,70,.32) 0%,transparent 55%),
  radial-gradient(90% 55% at 15% 92%,rgba(109,117,70,.22) 0%,transparent 60%),
  radial-gradient(70% 45% at 40% 45%,rgba(250,250,235,.30) 0%,transparent 70%)}
/* ── 品牌竖排(左上,仿参考排版)── */
.brand{position:absolute;left:66px;top:190px;display:flex;flex-direction:column;align-items:center;gap:30px;z-index:9}
.ring{width:74px;height:74px;border:3px solid #56533a;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:"ZMX";font-size:40px;color:#56533a}
.enbox{border:3px solid #56533a;padding:8px 6px;font:700 17px/1.25 Georgia,serif;letter-spacing:2px;color:#56533a;text-align:center;width:58px}
.frame{border:3px solid #514e36;padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.frame .ch{font-family:"ZMX";font-size:100px;color:#47442f;line-height:1.02}
.py{font:italic 22px Georgia,serif;color:#56533a;letter-spacing:4px}
.seal{width:58px;height:58px;background:#a8452e;border-radius:8px;color:#f5eedb;font-family:"ZMX";
  font-size:23px;line-height:1.05;display:flex;align-items:center;justify-content:center;text-align:center}
.tag{position:absolute;left:180px;top:208px;writing-mode:vertical-rl;font:26px/1 "Noto Serif SC","SimSun",serif;
  color:#5d5a40;letter-spacing:16px;opacity:.85;z-index:9}
</style></head><body>
<div class="branch" style="left:-320px;top:520px;transform:rotate(24deg)"></div>
<div class="cl" style="left:290px;top:-60px;width:460px;height:520px">
  <div class="leaf" style="left:40px;top:30px;width:150px;height:90px;transform:rotate(20deg)"></div>
  <div class="leaf" style="left:180px;top:80px;width:180px;height:100px;transform:rotate(-14deg)"></div>
  <div class="leaf" style="left:90px;top:170px;width:140px;height:86px;transform:rotate(48deg)"></div>
  <div class="leaf" style="left:250px;top:210px;width:170px;height:95px;transform:rotate(8deg)"></div>
  <div class="leaf" style="left:150px;top:300px;width:120px;height:80px;transform:rotate(-30deg)"></div>
  <div class="leaf" style="left:300px;top:330px;width:150px;height:88px;transform:rotate(30deg)"></div>
</div>
<div class="cl2" style="left:430px;top:380px;width:340px;height:420px">
  <div class="leaf" style="left:20px;top:20px;width:170px;height:100px;transform:rotate(-24deg)"></div>
  <div class="leaf" style="left:140px;top:130px;width:190px;height:110px;transform:rotate(16deg)"></div>
  <div class="leaf" style="left:40px;top:250px;width:150px;height:90px;transform:rotate(54deg)"></div>
</div>
<div class="cl2" style="left:-80px;top:980px;width:420px;height:460px">
  <div class="leaf" style="left:30px;top:40px;width:190px;height:110px;transform:rotate(12deg)"></div>
  <div class="leaf" style="left:170px;top:150px;width:160px;height:95px;transform:rotate(-38deg)"></div>
  <div class="leaf" style="left:60px;top:270px;width:180px;height:100px;transform:rotate(30deg)"></div>
  <div class="leaf" style="left:230px;top:320px;width:130px;height:80px;transform:rotate(-10deg)"></div>
</div>
<div class="cl" style="left:380px;top:1150px;width:380px;height:430px;opacity:.3">
  <div class="leaf" style="left:50px;top:30px;width:170px;height:95px;transform:rotate(-18deg)"></div>
  <div class="leaf" style="left:180px;top:150px;width:190px;height:105px;transform:rotate(26deg)"></div>
  <div class="leaf" style="left:80px;top:280px;width:150px;height:88px;transform:rotate(58deg)"></div>
</div>
<div class="vig"></div>
<div class="brand">
  <div class="ring">易</div>
  <div class="enbox">WAN<br>ZHAN</div>
  <div class="frame"><div class="ch">玩</div><div class="ch">占</div></div>
  <div class="py">wán zhān</div>
  <div class="seal">玩<br>占</div>
</div>
<div class="tag">观 其 变 而 玩 其 占</div>
</body></html>
