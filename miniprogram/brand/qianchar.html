<!doctype html><!-- 档位字用 cwTeX Q Kai(繁体楷书,GPL+font exception):curl -L -o cwTeXQKai-Medium.ttf https://cdn.jsdelivr.net/gh/l10n-tw/cwtex-q-fonts-TTFs/ttf/cwTeXQKai-Medium.ttf --><html><head><meta charset="utf-8"><style>
@font-face{font-family:"ZMX";src:url("ZhiMangXing-Regular.ttf")}
@font-face{font-family:"QKai";src:url("cwTeXQKai-Medium.ttf")}
*{margin:0;padding:0}html,body{overflow:hidden}
body{width:140px;height:100vh;background:transparent;display:flex;align-items:center;justify-content:center}
.t{font-family:"QKai";font-weight:700;color:#b5432f;font-size:100px;line-height:1.2}
.t.two{writing-mode:vertical-rl;font-size:96px;letter-spacing:6px}
</style></head><body><div class="t" id="t"></div>
<script>
const q = new URLSearchParams(location.search);
const t = document.getElementById('t');
const txt = q.get('t') || '吉';
t.textContent = txt;
if (txt.length > 1) t.classList.add('two');
</script>
</body></html>
