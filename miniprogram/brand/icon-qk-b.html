<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"ZMX";src:url("ZhiMangXing-Regular.ttf")}
*{margin:0;padding:0}body{width:512px;height:512px;background:#2b2822;display:flex;align-items:center;justify-content:center;overflow:hidden}
/* B. 玄墨金框:墨黑底 + 竖排乾坤 + 右下朱砂小印,冷峻风 */
.frame{width:408px;height:408px;border:9px solid #d7c391;border-radius:26px;display:flex;align-items:center;justify-content:center;position:relative;
  box-shadow:inset 0 0 0 13px #2b2822, inset 0 0 0 16px rgba(215,195,145,.45)}
.t{font-family:"ZMX";writing-mode:vertical-rl;font-size:186px;color:#efe6d2;letter-spacing:-8px;transform:translateX(2px);filter:url(#thin)}
.seal{position:absolute;right:34px;bottom:34px;width:64px;height:64px;background:#b5432f;border-radius:10px;
  display:flex;align-items:center;justify-content:center;color:#fbf3e2;font-family:"ZMX";font-size:34px}
</style></head><body>
<svg width="0" height="0"><filter id="thin"><feMorphology operator="erode" radius="2.2"/></filter></svg>
<div class="frame"><div class="t">乾坤</div><div class="seal">衣</div></div>
</body></html>
