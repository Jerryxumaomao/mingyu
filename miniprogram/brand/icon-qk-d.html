<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"ZMX";src:url("ZhiMangXing-Regular.ttf")}
*{margin:0;padding:0}body{width:512px;height:512px;background:#2b2822;display:flex;align-items:center;justify-content:center;overflow:hidden}
/* D. 圆环落款式:金双环 + 竖排乾坤 + 字下朱砂小印(圆形裁切安全) */
.ring{width:452px;height:452px;border-radius:50%;border:7px solid #d7c391;
  box-shadow:inset 0 0 0 5px #2b2822, inset 0 0 0 6.5px rgba(215,195,145,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.t{font-family:"ZMX";writing-mode:vertical-rl;font-size:158px;color:#efe6d2;letter-spacing:-10px;filter:url(#thin);transform:translateX(3px)}
.seal{width:52px;height:52px;background:#b5432f;border-radius:9px;
  display:flex;align-items:center;justify-content:center;color:#fbf3e2;font-family:"ZMX";font-size:29px}
</style></head><body>
<svg width="0" height="0"><filter id="thin"><feMorphology operator="erode" radius="2"/></filter></svg>
<div class="ring"><div class="t">乾坤</div><div class="seal">衣</div></div>
</body></html>
