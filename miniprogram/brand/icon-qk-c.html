<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"ZMX";src:url("ZhiMangXing-Regular.ttf")}
*{margin:0;padding:0}body{width:512px;height:512px;background:#b5432f;display:flex;align-items:center;justify-content:center;overflow:hidden}
/* C. 对角错落章:乾坤斜向错位(传统二字印的动感排布) */
.frame{width:408px;height:408px;border:9px solid #fbf3e2;border-radius:26px;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 13px #b5432f, inset 0 0 0 16px rgba(251,243,226,.5)}
.t{position:absolute;font-family:"ZMX";font-size:200px;line-height:1;color:#fbf3e2;filter:url(#thin)}
.q{left:36px;top:18px}
.k{right:32px;bottom:14px}
.dot{position:absolute;width:14px;height:14px;border-radius:50%;background:rgba(251,243,226,.75)}
</style></head><body>
<svg width="0" height="0"><filter id="thin"><feMorphology operator="erode" radius="2"/></filter></svg>
<div class="frame">
  <div class="t q">乾</div>
  <div class="t k">坤</div>
  <div class="dot" style="right:74px;top:78px"></div>
  <div class="dot" style="left:70px;bottom:84px"></div>
</div>
</body></html>
